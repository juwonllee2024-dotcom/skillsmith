name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependency
        run: python -m pip install . pytest
      - name: Test
        run: pytest -q
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Wheel install smoke test
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/skillsmith inspect tests/fixtures/golden/success-a.jsonl tests/fixtures/golden/success-b.jsonl tests/fixtures/golden/fail-done.jsonl
